# Development overrides (loaded automatically by `docker compose up`).
x-dev-volumes: &dev-volumes
  - ./backend:/app
  - ./backend/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
  - ./backend/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
  # Keep var/ off the bind-mount for faster I/O on macOS.
  - /app/var

services:
  php:
    build:
      target: frankenphp_dev
    volumes: *dev-volumes
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: playground
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
      # Proxy the SPA to the Vite dev server on the host (`make front`)
      SPA_MODE: dev
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  worker:
    volumes: *dev-volumes
    environment:
      XDEBUG_MODE: "off"
      APP_ENV: "${APP_ENV:-dev}"

  database:
    ports:
      # Expose Postgres on localhost:5434 for GUI clients during development.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
