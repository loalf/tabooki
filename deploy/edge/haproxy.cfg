# The shared front door of the server: one process owns ports 80 and 443 and hands each
# connection to the app whose hostname it asks for. Installed at /opt/edge (docs/DEPLOY.md).
#
# - HTTPS is passed through encrypted (routed by the TLS SNI name): each app keeps its own
#   certificates and renews them as before.
# - Tabooki gets the visitor's address via the PROXY protocol; rootware gets connections as
#   they were (its Caddy isn't set up for PROXY), from 127.0.0.1.
# - Anything not named here goes to rootware, which had these ports to itself before.

global
	log stdout format raw local0 info

defaults
	log global
	timeout connect 5s
	# Long-lived connections (server-sent events, websockets) stay open.
	timeout client 1h
	timeout server 1h

frontend https
	mode tcp
	bind [::]:443 v4v6
	option tcplog
	tcp-request inspect-delay 5s
	tcp-request content accept if { req_ssl_hello_type 1 }
	use_backend tabooki_https if { req_ssl_sni -i tabooki.xyz }
	default_backend rootware_https

frontend http
	mode http
	bind [::]:80 v4v6
	option httplog
	timeout http-request 10s
	use_backend tabooki_http if { hdr(host),field(1,:) -i tabooki.xyz }
	default_backend rootware_http

backend tabooki_https
	mode tcp
	server tabooki 127.0.0.1:9443 send-proxy-v2

backend tabooki_http
	mode http
	server tabooki 127.0.0.1:9080 send-proxy-v2

backend rootware_https
	mode tcp
	server rootware 127.0.0.1:8443

backend rootware_http
	mode http
	server rootware 127.0.0.1:8080
