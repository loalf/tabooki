# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Cached thumbnails (later: uploaded screenshots and videos). A Docker volume in compose.yaml.
    app.media_dir: '%kernel.project_dir%/var/media'
    # For the cost column of extraction runs: USD per million tokens, by model id. Models missing
    # here get no cost. These are list prices; Bedrock's EU cross-region profiles can cost a little
    # more: check https://aws.amazon.com/bedrock/pricing/ (Europe (Ireland), cross-region inference).
    app.llm_prices:
        # Claude Haiku 5.5, for prompts up to 100K tokens (ours are a few thousand).
        'eu.anthropic.claude-haiku-5-5': { input: 0.10, output: 0.50 }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Fetches link previews from arbitrary URLs pasted by users: never let it reach the
    # private network (Docker services, the tailnet, cloud metadata endpoints).
    link_preview.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']
        autoconfigure: false # the wrapped client already logs

    bedrock.http_client: '@http_client'
    openrouter.http_client: '@http_client'

when@test:
    parameters:
        app.media_dir: '%kernel.project_dir%/var/test-media'

    services:
        # Tests set canned responses on it: $container->get('link_preview.http_client')->setResponseFactory(...)
        link_preview.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
        bedrock.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
        openrouter.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
        # No yt-dlp in tests: canned answers, see App\Tests\FakeMediaFetcher.
        App\Extraction\MediaFetcher:
            class: App\Tests\FakeMediaFetcher
            public: true
