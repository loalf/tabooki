# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Password emails and attempts (App\Security\PasswordReset, App\State\ChangePasswordProcessor).
    rate_limiter:
        password_forgot:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        password_attempt:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
