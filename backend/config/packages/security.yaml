security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The iPhone Shortcut saves links with a personal token (App\Entity\ShareToken), no session.
        share:
            pattern: ^/api/share$
            stateless: true
            provider: app_user_provider
            access_token:
                token_handler: App\Security\ShareTokenHandler
        main:
            lazy: true
            provider: app_user_provider
            # The SPA signs in with fetch('/api/login', {email, password}) and then relies on the
            # session cookie (same origin, so no tokens or CORS involved).
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            # Phones should stay signed in: a signed remember-me cookie restores the session
            # after it expires or the container is redeployed.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000 # 1 year
                always_remember_me: true
                samesite: lax
            logout:
                path: api_logout
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/password/(forgot|reset)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
