framework:
    messenger:
        failure_transport: failed

        transports:
            # Background jobs (recipe extraction from M2 on), consumed by the `worker` container.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 4
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'App\Message\FetchSourceMetadata': async
            'App\Message\ExtractSource': async
            'App\Message\ClassifyIngredients': async
            'App\Message\DescribeFoods': async
            'App\Message\SuggestSubstitutes': async
            'App\Message\TranslateRecipe': async
            'App\Message\AnnotateRecipe': async
            'App\Message\JudgeNotes': async
            'App\Message\SummarizeTaste': async
            'App\Message\SendPasswordResetLink': async
            # Emails go out from the worker: the request doesn't wait for the mail server.
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
