# Base services, shared by development (compose.override.yaml, loaded automatically)
# and production (docker compose -f compose.yaml -f compose.prod.yaml ...).
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-tabooki}?serverVersion=17&charset=utf8
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
  MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
  MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
  MERCURE_JWT_ISSUER: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
  # Bedrock settings (API key, region, models) are not set here: in development they come from
  # backend/.env.local, in production from compose.prod.yaml. An empty value here would hide them.

services:
  # FrankenPHP: Caddy (HTTPS, Mercure hub, SPA) + the Symfony API
  php:
    image: ${PHP_IMAGE:-tabooki-php-dev}
    build:
      context: ./backend
      additional_contexts:
        frontend: ./frontend
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}}
      MERCURE_TRUSTED_ISSUERS: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/app/var/media
    depends_on:
      database:
        condition: service_healthy
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # Symfony Messenger worker: same image, runs background jobs (recipe extraction, ...)
  worker:
    image: ${PHP_IMAGE:-tabooki-php-dev}   # built by the php service
    pull_policy: never
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    environment:
      <<: *app-env
      SKIP_MIGRATIONS: "1"
    volumes:
      - media_data:/app/var/media
    healthcheck:
      # The consumer runs as PID 1 (exec'd by the entrypoint): healthy while it's alive.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      start_period: 30s
    depends_on:
      php:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabooki}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-tabooki}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  database_data:
  # Cached thumbnails (later: uploads). Shared by php and worker; include it in backups.
  media_data:
